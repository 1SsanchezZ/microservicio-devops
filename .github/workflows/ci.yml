name: CI/CD Pipeline Microservicio DevOps

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Ejecutar pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar PyTest explícitamente
        run: pip install pytest

      - name: Ejecutar pruebas con PyTest
        run: python -m pytest .

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Construir imagen Docker
        run: docker build -t microservicio-devops .

  security:
    name: Escaneo de seguridad con Trivy
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Construir imagen Docker
        run: docker build -t microservicio-devops .
      
      - name: Escanear imagen Docker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: microservicio-devops
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: 'true'

deploy:
    name: Despliegue Continuo en AWS EC2 Real
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Compilar Imagen de Producción
        run: docker build -t microservicio-devops:latest .

      - name: Empaquetar Imagen a Archivo Comprimido
        run: docker save -o microservicio.tar microservicio-devops:latest

      - name: Instalar Docker y Preparar Servidor Remoto EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: root
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo "--- Verificando estado de Docker en AWS ---"
            if ! command -v docker &> /dev/null; then
              dnf update -y
              dnf install docker -y
              systemctl start docker
              systemctl enable docker
            fi
            
            echo "--- Limpiando contenedores antiguos para liberar el puerto 5000 ---"
            docker stop mi-app-flask || true
            docker rm mi-app-flask || true

      - name: Transferir Archivo Tar al Servidor de AWS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: root
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "microservicio.tar"
          target: "/root/"

      - name: Cargar Imagen y Levantar Contenedor en AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: root
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo "--- Cargando la nueva imagen Docker ---"
            docker load -i /root/microservicio.tar
            rm -f /root/microservicio.tar
            
            echo "--- Iniciando el microservicio en el puerto 5000 ---"
            docker run -d -p 5000:5000 --name mi-app-flask microservicio-devops:latest
            
            echo "--- Validando disponibilidad del servicio ---"
            sleep 5
            docker ps
            curl --fail http://localhost:5000/health || exit 1
            