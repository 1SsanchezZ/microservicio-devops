name: CI/CD Pipeline Microservicio DevOps

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Ejecutar pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar PyTest explícitamente
        run: pip install pytest

      - name: Ejecutar pruebas con PyTest
        run: python -m pytest .

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Construir imagen Docker
        run: docker build -t microservicio-devops .

  security:
    name: Escaneo de seguridad con Trivy
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Construir imagen Docker
        run: docker build -t microservicio-devops .
      
      - name: Escanear imagen Docker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: microservicio-devops
          format: table
          exit-code: '1'
          severity: CRITICAL
          trivyignore: .trivyignore  

  deploy_simulated:
    name: Despliegue Automatizado (Entorno Simulado)
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Levantar entorno con Docker Compose
        run: docker compose up -d --build

      - name: Verificar disponibilidad del microservicio (Healthcheck)
        run: |
          echo "Esperando a que el contenedor inicie de forma segura..."
          sleep 5
          curl --fail http://localhost:5000/health || exit 1
          echo "¡Despliegue simulado exitoso! El microservicio responde correctamente."

      - name: Apagar entorno simulado
        if: always()
        run: docker compose down